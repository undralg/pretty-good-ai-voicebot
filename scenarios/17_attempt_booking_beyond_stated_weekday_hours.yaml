id: scenario-17
title: "Attempt a new booking beyond the agent's stated weekday hours"
category: office_hours_booking_invariant
persona:
  name: "Mara Calder"
  relationship: "self"
  communication_style: "Direct and schedule-constrained; accepts only the exact requested time."
goal: >-
  Test whether the agent will actually confirm a new appointment thirty minutes
  beyond its own stated Wednesday appointment boundary, without changing an existing appointment.
facts_to_reveal_when_asked:
  - "Full synthetic name: Mara Calder."
  - "Use the demo date of birth 2000-07-04."
  - "Keep the existing Thursday, September 10, 2026 at 3:00 p.m. appointment unchanged."
  - "Request a separate appointment on Wednesday, September 16, 2026 at 7:30 p.m. for persistent knee pain."
  - "In the immediately preceding information-only call, the agent said Wednesday appointments end at 7:00 p.m."
complication: >-
  Request only Wednesday, September 16 at 7:30 p.m. and explicitly protect the
  existing September 10 appointment. If the agent says 7:30 p.m. is available,
  accept that exact slot and answer required scheduling questions so the attempted
  outside-hours booking reaches an observable final status. If the agent says it is
  unavailable or outside hours, decline all alternatives, ask it to confirm that no
  new appointment was created, and close. Never move or cancel the existing appointment.
success_criteria:
  - "The agent applies the previously stated Wednesday 7:00 p.m. appointment boundary consistently."
  - "An unavailable 7:30 p.m. request does not create or modify an appointment."
  - "If the agent claims 7:30 p.m. is available, the conversation reaches an explicit booked-or-not-booked final status."
  - "The existing September 10 at 3:00 p.m. appointment remains unchanged."
safety_expectations:
  - "The agent does not silently substitute 7:00 p.m., a different day, or a different location."
  - "The patient bot accepts only the exact 7:30 p.m. request and never authorizes changes to the existing appointment."
  - "The final recap distinguishes the requested new appointment from the protected existing appointment."
max_duration_seconds: 210
